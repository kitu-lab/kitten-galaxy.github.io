<!DOCTYPE html>
<html>
  <head>
  <audio src="https://raw.githubusercontent.com/kitu-lab/kitu-lab.github.io/refs/heads/main/mario-meow.mp3" id="meow"></audio>
  <script>
  let clickAmount = 0
    function pet() {
      meow.currentTime = 0;
      document.getElementById("meow").play();
      
      clickAmount++;
      
      document.getElementById("pet-count").textContent = clickAmount;
      }
  </script>
  <title>kitten galaxy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <style>
      body {
        background: #171221;
        background-image:
        radial-gradient(2px 2px at 20px 30px, white, transparent),
        radial-gradient(1px 2px at 72px 85px, #b9c8ff, transparent),
        radial-gradient(2px 2px at 120px 39px, white, transparent),
        radial-gradient(1px 2px at 150px 110px, #e4c9ff, transparent);
        background-size: 200px 150px;
        background-repeat: repeat;
        justify-content: center;
        display: flex;
        align-items: center;
        flex-direction: column;
        }
        .button1 {
        background: #ef7c7e;
        font-family:  Comic Neue;
        font-size: 3vh;
        color: #7a213a;
        width: 90%;
        height: 10%; 
        border: none;
        position: absolute;
        transition: 0.5s ease-out;
        border-radius: 15px;
        top: 85%;
        }
        .button1:hover {
           transform:  scale(1.06);
           transition: transform 0.2s ease-out;
        }
        .container {
          margin: 0 auto;
          display: flex;
          align-items: center;
          flex-direction: column;
          position: relative;
          top: 150px;
          width: 35%;
          height: 700px;
          border-radius: 20px;
          box-shadow: 0 0 15px #0d0411;
          background: #2a2335;
          color: #dddddd;
          }
       .kitten {
            position: relative;
            bottom: 6%;
            margin: 5% auto;
            width: 15%;
            height: auto;
            }
        @media (max-width: 1500px) and (min-width: 1000px) {
          .container {
            width: 40%;
            height: 600px;
          }
      }
        @media (max-width: 1200px) and (min-width: 1000px) {
          .container {
            width: 35%;
            height: 425px;
          }
        }
        @media (max-width: 1000px) and (min-width: 670px) {
          .container {
            width: 60%;
            height: 600px;
          }
        }
        @media (max-width: 670px) and (min-width: 500px) {
          .container {
            width: 90%;
            height: 540px;
          }
        }
        @media (max-width: 500px) and (min-width: 460px) {
          .container {
            width: 90%;
            height: 420px;
          }
        }
        @media (max-width: 460px) and (min-width: 350px) {
          .container {
            width: 60%;
            height: 440px;
          }
        }
        @media (max-width: 350px) and (min-width: 50px) {
          .container {
          	position: relative;
          	bottom: 55%;
            width: 100%;
            height: 400px;
          }
        }
        .count {
          gap: 15px;
          display: flex;
          align-items: row;
          flex-direction: flex-start;
          position: absolute;
          bottom: 80px;
          }
        .text2 {
          font-family: Comic Neue;
          }
        .text1 {
          font-family: Comic Neue;
          position: relative;
          margin: 0 auto;
          }
        .pet-count {
          font-size 25px;
          position: relative;
          }
   </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
    <div class="container">
      <div>
        <h1 class="text1" style="font-size:4vw;">kitten.clicker.com</h1>
        </div>
      <img class="kitten" style="width:100%;" src="https://github.com/kitu-lab/kitten-galaxy.github.io/blob/main/kitten.clicker.png?raw=true">
      <div class="count">
      <p class="text2">PET COUNT:</p>
      <p class= "pet-count" id="pet-count"></p>
      </div>
      <button class="button1" onclick="pet()">pet</button>
    </div> 
  </body>
</html>
