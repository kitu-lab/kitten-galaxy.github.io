<!DOCTYPE html>
<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <style>
      body {
        background: #171221;
        background-image:
        radial-gradient(2px 2px at 20px 30px, white, transparent),
        radial-gradient(1px 2px at 72px 85px, #b9c8ff, transparent),
        radial-gradient(2px 2px at 120px 39px, white, transparent),
        radial-gradient(1px 2px at 150px 110px, #e4c9ff, transparent);
        background-size: 200px 150px;
        background-repeat: repeat;
        display: flex;
        align-items: center;
        flex-direction: column;
        }
        .button1 {
        background: #ef7c7e;
        font-family:  Comic Neue;
        font-size: 100%;
        color: #7a213a;
        width: 90%;
        height: 10%; 
        border: none;
        position: absolute;
        transition: 0.5s ease-out;
        border-radius: 15px;
        top: 85%;
        }
        .button1:hover {
           transform:  scale(1.06);
           transition: transform 0.2s ease-out;
        }
        .container {
          display: flex;
          align-items: center;
          flex-direction: column;
          position: relative;
          min-height: 100;
          top: 50px;
          width: 25%;
          height: 500px;
          border-radius: 20px;
          box-shadow: 0 0 15px #0d0411;
          background: #2a2335;
          color: #dddddd;
          }
        @media (max-width: 1024px) {
          .container {
            width: 60%;
            height: 500px;
          }
        @media (max-width: 600px) {
          .container {
            width: 60%;
            height: 480px;
          }
        @media (max-width: 300px) {
          .container {
            width: 75%;
            height: 400px;
          }
          .button1 {
            top: 85%
          }
        }
      }
        .kitten {
          width: 75%;
          height: auto;
          position: absolute;
          top: 15%;
          left: 13%;
          }
   </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
    <div class="container">
      <p>NOT FUNCTIONING YET!</p>
      <div class="image"><img class="kitten" src="https://github.com/kitu-lab/kitten-galaxy.github.io/blob/main/kitten.clicker.png?raw=true"></div>
      <button class="button1">click</button>
    </div> 
  </body>
</html>
